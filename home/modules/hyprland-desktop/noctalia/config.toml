[audio]
enable_overdrive = true
enable_sounds = true

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    capsule = true
    capsule_fill = "tertiary"
    capsule_opacity = 0.099999997764825821
    capsule_thickness = 0.74999998696148396
    center = [ "workspaces" ]
    contact_shadow = true
    end = [ "tray", "recorder", "brightness", "group:g2", "network", "group:g1", "battery", "notifications", "session" ]
    font_weight = 600
    margin_ends = 10
    radius = 15
    start = [ "launcher", "clock", "media" ]

        [[bar.default.capsule_group]]
        enabled = true
        fill = "tertiary"
        id = "g2"
        members = [ "volume", "input_volume" ]
        opacity = 0.099999994039535522
        padding = 6.0

        [[bar.default.capsule_group]]
        enabled = true
        fill = "tertiary"
        id = "g1"
        members = [ "ram", "cpu" ]
        opacity = 0.099999994039535522
        padding = 6.0

[desktop_widgets]
enabled = false
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[hooks]
started = "noctalia msg session lock"

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
address = "Moscow, Russia"

[lockscreen]
tint_intensity = 0.0

