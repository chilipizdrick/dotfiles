[nightlight]
enabled = true

[notification]
background_opacity = 0.79999998211860657

[osd]
background_opacity = 0.79999998211860657

    [osd.kinds]
    media = false

[plugin_settings."noctalia/screen_recorder"]
video_source = "portal"

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
clipboard_history_max_entries = 1000
font_family = "Inter"
polkit_agent = true
screen_time_enabled = true

    [shell.panel]
    control_center_placement = "floating"
    session_placement = "floating"
    transparency_mode = "glass"
    wallpaper_placement = "floating"

    [shell.screenshot]
    directory = "~/Pictures/Screenshots"
    pipe_command = "satty -f -"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "l"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "g"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "p"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "r"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "s"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 5

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]

[wallpaper]
directory = "/home/alex/Pictures/wallpapers"
transition = [ "fade" ]

    [wallpaper.default]
    path = "/home/alex/Pictures/wallpapers/landscapes/flower_catppuccin.jpg"

    [wallpaper.last]
    path = "/home/alex/Pictures/wallpapers/landscapes/flower_catppuccin.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/alex/Pictures/wallpapers/landscapes/flower_catppuccin.jpg"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/alex/Pictures/wallpapers/landscapes/flower_catppuccin.jpg"

[widget.audio_visualizer]
bands = 32
mirrored = false
width = 201

[widget.battery]
enabled = true

[widget.clock]
format = "{:%H:%M %a %d %b}"

[widget.cpu]
enabled = true

[widget.input_volume]
enabled = false

[widget.media]
art_size = 30
hide_when_no_media = true
max_length = 260

[widget.network]
show_label = false

[widget.ram]
enabled = true

[widget.recorder]
type = "noctalia/screen_recorder:recorder"

[widget.tray]
drawer = true
pinned = [ "AmneziaVPN" ]

